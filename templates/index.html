<!DOCTYPE html>
<html>
<head>
    <title>DDoS Detection Dashboard</title>
    <meta http-equiv="refresh" content="2">

    <style>
        body {
            font-family: Arial;
            background-color: #0f172a;
            color: white;
            text-align: center;
        }

        h1 {
            color: #38bdf8;
            margin-top: 20px;
        }

        h2 {
            color: #e2e8f0;
        }

        .container {
            width: 60%;
            margin: auto;
            margin-top: 20px;
        }

        .alert {
            background-color: #1e293b;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            text-align: left;
        }

        .time {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 5px;
        }

    </style>
</head>

<body>

    <h1>🚨 DDoS Detection Dashboard</h1>
    <h2>Total Alerts: {{ alerts|length }}</h2>

    <div class="container">
        {% for alert in alerts %}

            {% if "ML" in alert.message %}
                <div class="alert" style="border-left: 6px solid red;">
            
            {% elif "High traffic" in alert.message %}
                <div class="alert" style="border-left: 6px solid yellow;">
            
            {% else %}
                <div class="alert" style="border-left: 6px solid orange;">
            
            {% endif %}

                <div>{{ alert.message }}</div>
                <div class="time">{{ alert.time }}</div>
            </div>

        {% endfor %}
    </div>

    <script>
        window.scrollTo(0, document.body.scrollHeight);
    </script>

</body>
</html>
